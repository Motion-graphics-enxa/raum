# Ollama drop-in for RAUM (plan §6.12, §8 S4).
#   sudo mkdir -p /etc/systemd/system/ollama.service.d
#   sudo cp /opt/raum/app/deploy/systemd/ollama-raum.conf /etc/systemd/system/ollama.service.d/raum.conf
#   sudo systemctl daemon-reload && sudo systemctl restart ollama
# Check: `ollama ps` must show 100% GPU in the PROCESSOR column.
[Service]
# keep every model loaded (no cold start mid-conversation)
Environment="OLLAMA_KEEP_ALIVE=-1"
# translator + checker + embeddings at once (~88-90 GB on the GX10)
Environment="OLLAMA_MAX_LOADED_MODELS=3"
Environment="OLLAMA_NUM_PARALLEL=4"
# localhost only: nothing outside the box talks to the models
Environment="OLLAMA_HOST=127.0.0.1:11434"
