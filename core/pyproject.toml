[project]
name = "raum"
version = "0.1.0"
description = "RAUM: a private AI interpreter that lives in the room. Translates. Checks. Forgets."
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "websockets>=13",
    "cryptography>=43",
    "numpy>=1.26",
    "soxr>=0.4",
    "livekit>=1.0",
    "livekit-api>=1.0",
    "livekit-agents>=1.2",
    "livekit-plugins-silero>=1.2",
]

[project.optional-dependencies]
dates = ["dateparser>=1.2"]
# C-05 noise cleaning (DeepFilterNet3 on CPU). `uv sync --extra denoise`; set RAUM_UV_EXTRAS on the box.
denoise = ["deepfilternet>=0.5.6", "torch>=2.2", "torchaudio>=2.2"]
# Semantic end of turn (raum.pipeline.turn): LiveKit text EOU (+ transformers, huggingface-hub; the plugin is
# deprecated upstream, hence the pin). `uv sync --extra turn`, then `python -m raum.pipeline.turn download`.
turn = ["livekit-plugins-turn-detector>=1.8.10,<1.9"]

[project.scripts]
raum = "raum.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
# CPU wheels on Linux: denoise runs on the Grace CPU; no multi-GB CUDA libraries for it
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["raum"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py312"
