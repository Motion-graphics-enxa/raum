# Each term:
#   de:     the German form (canonical key)
#   kind:   medication | name | term   (medication/name are checked by the fact guard)
#   keep:   true = keep as is in every language (drug names)
#   <lang>: fixed translation(s) used by the translator and accepted by the fact guard;
#           a list means "any of these is correct" (e.g. other scripts)
