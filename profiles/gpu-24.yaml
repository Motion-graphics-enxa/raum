# RTX 4090 / 5090 class workstation (24-32 GB VRAM).
profile: gpu-24
models:
  vad:       { engine: silero }
  denoise:   { engine: deepfilternet, options: { onnx: true } }
  asr:       { engine: whisper.cpp, url: http://127.0.0.1:8081, model: large-v3-turbo }
  translate: { engine: ollama, url: http://127.0.0.1:11434, model: gemma4:26b, options: { temperature: 0.1, num_predict: 256 } }
  verify:    { engine: ollama, url: http://127.0.0.1:11434, model: gpt-oss:20b, options: { reasoning: low } }
  embed:     { engine: ollama, url: http://127.0.0.1:11434, model: bge-m3 }
  vision:    { engine: ollama, url: http://127.0.0.1:11434, model: gemma4:26b }
  tts:       { engine: piper }
scheduler: { live_slots: 2, check_slots: 1, background_slots: 1 }
