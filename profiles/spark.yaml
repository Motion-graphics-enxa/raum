# ASUS Ascent GX10 (NVIDIA GB10, 128 GB unified memory). Reference box. ~88-90 GB loaded at once.
profile: spark
models:
  vad:       { engine: silero, options: { min_silence_duration: 0.6, activation_threshold: 0.5 } }
  denoise:   { engine: passthrough }   # DeepFilterNet blocks the agent loop per frame: redesign pending (threaded 200 ms blocks)
  asr:       { engine: whisper.cpp, url: http://127.0.0.1:8081, model: large-v3-turbo, options: { partial_every_ms: 500 } }
  translate: { engine: ollama, url: http://127.0.0.1:11434, model: gemma4:26b, options: { think: false, temperature: 0.1, num_predict: 256, num_ctx: 8192 } }
  verify:    { engine: ollama, url: http://127.0.0.1:11434, model: gpt-oss:120b, options: { reasoning: low, num_predict: 256 } }
  embed:     { engine: ollama, url: http://127.0.0.1:11434, model: bge-m3 }
  # same model and num_ctx as translate: Ollama shares the loaded runner (another num_ctx would reload it)
  vision:    { engine: ollama, url: http://127.0.0.1:11434, model: gemma4:26b, options: { think: false, temperature: 0.1, num_predict: 1024, num_ctx: 8192, timeout_s: 120 } }
  tts:       { engine: piper, options: { voices_dir: ~/Desktop/HackathonRaum/runtime/voices }, fallback: none }
scheduler: { live_slots: 2, check_slots: 1, background_slots: 1 }
security:  { data_dir: ~/Desktop/HackathonRaum/data }   # shared GX10: everything stays in our folder
