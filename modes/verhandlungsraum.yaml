# Verhandlungsraum: CEO and foreign partner.
id: verhandlungsraum
order: 3
prefix: vr                     # room ids: vr-3305
name: { de: Verhandlungsraum, en: Negotiation room, tr: Müzakere odası, ru: Переговорная, ar: غرفة التفاوض }
tagline: { de: Jedes Angebot festgehalten, en: Every offer on record, tr: Her teklif kayıtta, ru: Каждое предложение зафиксировано, ar: كل عرض موثق }
icon: handshake
roles:
  a: { label: { de: Geschäftsführung, en: CEO, tr: Genel müdür, ru: Руководитель, ar: المدير التنفيذي }, default_lang: de }
  b: { label: { de: Partner/in, en: Partner, tr: Ortak, ru: Партнёр, ar: الشريك }, default_lang: auto }
register: formal
guard:
  kinds: [amount, currency, percent, number, date, deadline, name, negation]
  confirm_on: [amount]
glossary: glossaries/deal-de.yaml
prompts:
  translate: prompts/translate.md
  summary: prompts/summary-verhandlungsraum.md
summary:
  sections: [agreed, open, offers, next_steps]
  takehome_for: b
  file_note_for: a
buttons: [off_record, offer_tracker, end]
retention: { auto_burn_minutes: 60 }
