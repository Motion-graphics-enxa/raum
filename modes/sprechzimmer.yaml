# Sprechzimmer: doctor (or clinic) and patient. Leads the pitch.
id: sprechzimmer
order: 1
prefix: sz                     # room ids: sz-4821
name: { de: Sprechzimmer, en: Consultation room, tr: Muayene odası, ru: Кабинет врача, ar: غرفة الفحص }
tagline: { de: Dosis und Allergien geprüft, en: Doses and allergies checked, tr: Doz ve alerjiler kontrol edilir, ru: Дозы и аллергии проверяются, ar: الجرعات والحساسية تحت التحقق }
icon: stethoscope
roles:
  a: { label: { de: Ärztin/Arzt, en: Doctor, tr: Doktor, ru: Врач, ar: الطبيب }, default_lang: de }
  b: { label: { de: Patient/in, en: Patient, tr: Hasta, ru: Пациент, ar: المريض }, default_lang: auto }
register: formal               # Sie
guard:
  kinds: [dose, frequency, allergy, date, time, number, medication, negation]
  confirm_on: [dose, allergy]
glossary: glossaries/medical-de.yaml
prompts:
  translate: prompts/translate.md
  summary: prompts/summary-sprechzimmer.md
  repeat_back: prompts/repeat-back.md
summary:
  sections: [medications, allergies, next_appointment, warning_signs, open_questions]
  takehome_for: b
  file_note_for: a
buttons: [off_record, repeat_back, human_interpreter, end]
retention: { auto_burn_minutes: 30 }
# Consecutive with smart endpointing; simultaneous (headphone listeners) only for long turns, at complete
# sentence ends: a German clause never goes out before its finite verb or particle. A sentence cut at a pause
# ("... ab morgen | nicht mehr nehmen.") is merged again if the doctor goes on within 1.2 s (its voice stops).
pipeline: { simultaneous: auto, simultaneous_after_ms: 4000, merge_continuation_ms: 1200 }
